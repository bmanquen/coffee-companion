appId: dev.offbyonelabs.coffeecompanion
---
- launchApp:
    clearState: true
- openLink:
    link: ${EXPO_DEV_CLIENT_URL}
    browser: false
- extendedWaitUntil:
    visible:
      text: "This is the developer menu.*"
    timeout: 15000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Runtime version.*"
    timeout: 15000
    optional: true
- tapOn:
    text: "Close"
    optional: true
- runFlow:
    when:
      visible: "Go home"
    commands:
      - pressKey: back
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 60000
- takeScreenshot: signed-out
- tapOn:
    id: e2e-sign-in
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 60000
- takeScreenshot: signed-in
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 60000
- takeScreenshot: signed-out-again
