appId: dev.offbyonelabs.coffeecompanion
---
- launchApp:
    clearState: true
- openLink:
    link: ${EXPO_DEV_CLIENT_URL}
    browser: false
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 60000
- assertVisible:
    id: sign-in-screen
- takeScreenshot: signed-out
- tapOn:
    id: e2e-sign-in
- assertVisible:
    id: welcome-screen
- takeScreenshot: signed-in
- tapOn:
    id: sign-out
- assertVisible:
    id: sign-in-screen
- takeScreenshot: signed-out-again
