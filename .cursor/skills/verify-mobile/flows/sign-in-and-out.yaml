appId: dev.offbyonelabs.coffeecompanion
---
- launchApp:
    clearState: true
# clearState cold-starts the Expo launcher; openLink only after that screen can take the intent.
- extendedWaitUntil:
    visible: "Fetch development servers"
    timeout: 30000
- openLink:
    link: ${EXPO_DEV_CLIENT_URL}
    browser: false
- runFlow:
    label: Re-open Metro deep link if still on the Expo launcher
    when:
      visible: "Fetch development servers"
    commands:
      - openLink:
          link: ${EXPO_DEV_CLIENT_URL}
          browser: false
# The second openLink is still transitioning; fail only if the launcher stays.
- extendedWaitUntil:
    notVisible: "Fetch development servers"
    timeout: 30000
# Overlays can appear after the first check. Poll until sign-in-screen while dismissing them.
- repeat:
    times: 12
    while:
      notVisible:
        id: sign-in-screen
    commands:
      - runFlow:
          label: Dismiss first-run Continue sheet
          when:
            visible: "This is the developer menu.*"
          commands:
            - tapOn:
                text: "Continue"
      - runFlow:
          label: Dismiss regular developer menu
          when:
            visible: "Runtime version.*"
          commands:
            - tapOn:
                text: "Close"
                optional: true
            - runFlow:
                when:
                  visible: "Go home"
                commands:
                  - pressKey: back
      - assertVisible:
          id: sign-in-screen
          optional: true
- assertVisible:
    id: sign-in-screen
- assertVisible:
    id: sign-in-heading
- copyTextFrom:
    id: sign-in-heading
- assertTrue: ${maestro.copiedText == "Sign in"}
- takeScreenshot: signed-out
- tapOn:
    id: e2e-sign-in
# get-session is a network hop; an immediate visible check would fail before the session lands.
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 60000
- assertVisible:
    id: welcome-heading
- copyTextFrom:
    id: welcome-heading
- assertTrue: ${maestro.copiedText == "Coffee Companion"}
- takeScreenshot: signed-in
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 60000
- assertVisible:
    id: sign-in-heading
- copyTextFrom:
    id: sign-in-heading
- assertTrue: ${maestro.copiedText == "Sign in"}
- takeScreenshot: signed-out-again
# Sign-out must persist in SecureStore: relaunch without wiping data.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 60000
- assertVisible:
    id: sign-in-heading
- copyTextFrom:
    id: sign-in-heading
- assertTrue: ${maestro.copiedText == "Sign in"}
- takeScreenshot: signed-out-after-relaunch
