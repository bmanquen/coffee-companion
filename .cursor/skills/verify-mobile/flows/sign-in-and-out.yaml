appId: dev.offbyonelabs.coffeecompanion
---
- launchApp:
    clearState: true
- openLink:
    link: ${EXPO_DEV_CLIENT_URL}
    browser: false
# Overlay dismiss is runFlow when visible. tapOn has no timeout; wait with extendedWaitUntil.
- runFlow:
    label: Dismiss first-run Continue sheet
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn:
          text: "Continue"
- runFlow:
    label: Dismiss regular developer menu
    when:
      visible: "Runtime version.*"
    commands:
      - tapOn:
          text: "Close"
          optional: true
      - runFlow:
          when:
            visible: "Go home"
          commands:
            - pressKey: back
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 60000
- takeScreenshot: signed-out
- tapOn:
    id: e2e-sign-in
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 60000
- takeScreenshot: signed-in
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 60000
- takeScreenshot: signed-out-again
