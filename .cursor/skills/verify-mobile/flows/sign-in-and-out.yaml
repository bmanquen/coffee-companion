appId: dev.offbyonelabs.coffeecompanion
---
- launchApp:
    clearState: true
# clearState cold-starts the Expo launcher; openLink only after that screen can take the intent.
- extendedWaitUntil:
    visible: "Fetch development servers"
    timeout: 30000
- openLink:
    link: ${EXPO_DEV_CLIENT_URL}
    browser: false
- runFlow:
    label: Re-open Metro deep link if still on the Expo launcher
    when:
      visible: "Fetch development servers"
    commands:
      - openLink:
          link: ${EXPO_DEV_CLIENT_URL}
          browser: false
- runFlow:
    when:
      visible: "Fetch development servers"
    commands:
      - assertTrue:
          condition: ${false}
          label: Expo Development servers launcher is still showing; Metro deep link did not connect
# Overlay dismiss is runFlow when visible. tapOn has no timeout; wait with extendedWaitUntil.
- runFlow:
    label: Dismiss first-run Continue sheet
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn:
          text: "Continue"
- runFlow:
    label: Dismiss regular developer menu
    when:
      visible: "Runtime version.*"
    commands:
      - tapOn:
          text: "Close"
          optional: true
      - runFlow:
          when:
            visible: "Go home"
          commands:
            - pressKey: back
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 60000
- assertVisible:
    id: sign-in-heading
    text: "Sign in"
- takeScreenshot: signed-out
- tapOn:
    id: e2e-sign-in
# get-session is a network hop; an immediate visible check would fail before the session lands.
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 60000
- assertVisible:
    id: welcome-heading
    text: "Coffee Companion"
- takeScreenshot: signed-in
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 60000
- takeScreenshot: signed-out-again
