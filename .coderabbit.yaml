# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Greptile-style CodeRabbit config: few high-signal comments, a verdict-style
# summary with a confidence score, and an approve/request-changes sign-off.

language: en-US
tone_instructions: >-
  Be terse and direct. Only comment when there is a concrete bug, security issue,
  or behavior change. No praise, no restating the diff, no speculative "consider" advice.

reviews:
  # "quiet" posts only the most important comments inline and folds the rest
  # into the review summary. This is the biggest single lever toward Greptile's feel.
  profile: quiet

  # Canonical replacements for the deprecated reviews.request_changes_workflow
  # and reviews.allow_author_approval aliases. Do not set both old and new keys.
  auto_approvals:
    enabled: true
    allow_author_approval: false

  # --- Greptile-style summary ---
  high_level_summary: true
  # Write the summary into the PR description by replacing `@coderabbitai summary`.
  # true here sends it to the walkthrough instead, and that path ignored our format.
  high_level_summary_in_walkthrough: false
  high_level_summary_instructions: |
    Rewrite this summary from the code at the latest reviewed HEAD commit only.
    Ignore earlier revisions, dropped commits, and commit-message history as
    requirements. The current PR description is the source of intent: if it
    says an approach was intentionally dropped, that is not a missing
    requirement.

    Score only the code. Never deduct because you cannot independently re-run
    tests, coverage, lint, or typecheck that the author reports. GitHub status
    checks are the verification: failing checks lower the score and must be
    named; passing or pending checks do not. 5/5 is required when there are no
    concrete code issues and no failing GitHub checks.

    Deduct only for (a) a concrete issue cited as file:line, or (b) a failing
    GitHub check cited by check name. Every point below 5 must name what cost
    it. "Worth a human look" never changes the score.

    Format the summary exactly like this:

    **Confidence: X/5**, followed by one sentence that names every deduction
    (or says there are none).
      5 = safe to merge, no concrete code issues
      4 = safe to merge, minor non-blocking cited notes
      3 = needs a closer human look at specific cited areas
      2 = likely bugs or risky changes, fix before merging
      1 = serious correctness, security, or breaking-change problems

    Last reviewed commit: <short sha of the HEAD commit just reviewed>

    **What changed**: 2-4 bullets, behavior-level, not file-level.

    **Issues to address before merge**: a numbered list of only blocking
    problems, each with file:line (or GitHub check name) and one sentence.
    Write "None" if there are none.

    **Worth a human look**: up to 3 bullets for areas where intent or context
    can't be judged from the diff alone. Omit this section if empty. Do not
    use it to ask a human to re-verify tests or CI.

    **Per-file confidence**: a markdown table with columns File, Score, Note.
    One row per file with a non-trivial change (logic, types, or behavior).
    Score is n/5; Note is one line. Skip generated, vendored, lock, snapshot,
    and other trivial files (including drizzle snapshot.json). Omit the
    section if no files qualify.

    **Fixed since last review**: bullets of prior-review findings that this
    HEAD no longer has. Omit this section when there is no prior review.

  # Trim walkthrough noise
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  review_details: false

  auto_review:
    enabled: true
    # Closest real key to "refresh the summary on each push"; docs say the
    # description summary is rewritten on every incremental review. There is
    # no separate regenerate-summary-on-review key.
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords: ["wip", "do not review"]

  # Don't spend comments on generated or vendored files
  path_filters:
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/generated/**"
    - "!**/*.snap"
    - "!**/drizzle/**/snapshot.json"

  # Tell it where to focus (edit the paths to match your repo)
  path_instructions:
    - path: "**/*.{ts,tsx}"
      instructions: |
        Only flag: missing await / unhandled promises, null/undefined paths,
        incorrect hook dependency arrays, stale closures, leaked subscriptions
        or listeners, and changes to exported types or function signatures.
        Do not comment on style, naming, or formatting; the linter handles those.
    - path: "**/*.kt"
      instructions: |
        Focus on coroutine scope and cancellation, main-thread blocking,
        nullability escapes (!!), lifecycle leaks, and public API changes.
        Ignore formatting; detekt/ktlint handles it.

  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: "off"          # turn back on if you actually want coverage gating
    title:
      mode: "off"
    description:
      mode: "warning"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: "No blocking issues"
        mode: "error"
        instructions: |
          Fail if the review found any correctness bug, security vulnerability,
          data-loss risk, or crash path that is still present in the latest
          commit. Pass otherwise. Style, naming, and nitpicks never cause a failure.
      - name: "Public API changes documented"
        mode: "warning"
        instructions: |
          If any exported function, type, component prop, or public Kotlin
          class/method signature was added, removed, or changed, pass only if the
          PR description mentions it under a "Breaking changes" or "API changes"
          heading. Pass if there are no public API changes.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  tools:
    github-checks:
      enabled: true

knowledge_base:
  learnings:
    scope: auto
